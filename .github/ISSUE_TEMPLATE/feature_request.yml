name: Feature Request
description: Suggest an idea or enhancement for MonitorLink.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea to make MonitorLink better? Pitch it here!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional context or alternatives considered
