name: Bug Report
description: Report an issue or bug with screen streaming, display drivers, or connection.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please provide as much technical detail as possible.
  - type: input
    id: os_version
    attributes:
      label: Windows Version
      description: e.g. Windows 11 23H2, Windows 10 22H2
      placeholder: Windows 11 Pro 23H2
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware / GPU
      description: e.g. Host: RTX 4070 / Laptop: Intel Iris Xe
      placeholder: Desktop: RTX 4080 | Laptop: Ryzen 7 7840HS
    validations:
      required: true
  - type: dropdown
    id: connection_type
    attributes:
      label: Connection Mode
      options:
        - Wi-Fi (Wireless)
        - Direct Ethernet Cable
        - USB-C Tethering
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Traceback
      description: Paste any error messages or console logs here.
      render: shell
